[pytest]
# mission_core is deliberately ROS-free, so its whole suite runs with plain
# pytest on a developer machine - no colcon, no sourced workspace.
#
#   python -m pytest                     # everything
#   python -m pytest -m "not integration"  # fast unit tests only
pythonpath = ros2_ws/src/mission_core
testpaths = ros2_ws/src/mission_core/test
addopts = -ra --strict-markers
markers =
    integration: full end-to-end mission runs (tens of seconds each)
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
