name: CI

# Three levels of evidence, deliberately kept as separate jobs so it is always
# visible which one passed:
#
#   1. unit-tests   - the ROS-free mission logic (mission_core).
#   2. ros-build    - the ROS 2 layer really compiles: interfaces generate,
#                     package dependencies resolve, entry points install.
#   3. gazebo-e2e   - Gazebo Harmonic actually runs the mission end to end.
#
# A green (1) says nothing about (3). That distinction is the whole point of
# splitting them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: mission_core unit tests (no ROS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pyyaml pytest
      - name: Show versions
        run: python -c "import cv2, numpy; print('opencv', cv2.__version__, '| numpy', numpy.__version__)"
      - name: Run the full suite
        run: python -m pytest -q --junit-xml=pytest-results.xml
      - name: Run one offline mission end to end
        run: python scripts/run_offline_mission.py --target TARGET_2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: pytest-results.xml

  ros-build:
    name: colcon build (ROS 2 Jazzy)
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS dependencies
        shell: bash
        run: |
          set -ex
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-opencv python3-numpy python3-yaml \
            ros-jazzy-cv-bridge ros-jazzy-tf2-ros ros-jazzy-sensor-msgs-py \
            ros-jazzy-visualization-msgs ros-jazzy-std-srvs ros-jazzy-ros-gz
      - name: Show versions
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          echo "ROS_DISTRO=$ROS_DISTRO"
          gz sim --versions || true
          python3 -c "import cv2; print('opencv', cv2.__version__)"
      - name: colcon build
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Verify the interfaces and executables actually installed
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          # Generated interfaces must be introspectable, not just compiled.
          ros2 interface show mission_interfaces/msg/QrObservation > /dev/null
          ros2 interface show mission_interfaces/srv/PlanPath > /dev/null
          ros2 interface show mission_interfaces/action/RunMission > /dev/null
          # Every node entry point must resolve.
          for exe in qr_detector_node world_model_node drone_explorer_node \
                     mission_manager_node rover_path_follower_node; do
            test -x "$(ros2 pkg prefix mission_nodes)/lib/mission_nodes/$exe"
          done
          # And the launch file must at least parse and expand.
          ros2 launch mission_bringup mission.launch.py --show-args
      - name: Probe what this OpenCV build can decode
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          # The QR front end is the most OpenCV-version-sensitive part of the
          # stack, and a build that cannot decode fails silently. Always run
          # this before the tests so the logs say *why*.
          python3 scripts/diagnose_qr_backend.py
      - name: Keep the diagnostic frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-diagnostic-frames
          path: qr-diagnostic/
      - name: colcon test
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon test --packages-select mission_core --event-handlers console_direct+
          colcon test-result --verbose

  gazebo-e2e:
    name: Gazebo E2E ${{ matrix.target }} (trial ${{ matrix.trial }}/3)
    needs: ros-build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: ros:jazzy
    env:
      # GitHub runners have no GPU, so Gazebo's sensors have to render through
      # Mesa's software rasteriser.
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      MESA_GL_VERSION_OVERRIDE: "3.3"
      QT_QPA_PLATFORM: offscreen
      # Keep DDS and gz transport on loopback inside the container.
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      GZ_IP: 127.0.0.1
    strategy:
      fail-fast: false
      # Nine independent missions are required, but avoid requesting nine
      # software-rendering runners at once. A green matrix means every target
      # reached MISSION_SUCCESS in all three trials.
      max-parallel: 3
      matrix:
        target: [TARGET_1, TARGET_2, TARGET_3]
        trial: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS and rendering dependencies
        shell: bash
        run: |
          set -ex
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-opencv python3-numpy python3-yaml \
            ros-jazzy-cv-bridge ros-jazzy-tf2-ros ros-jazzy-tf2-tools \
            ros-jazzy-sensor-msgs-py ros-jazzy-visualization-msgs ros-jazzy-std-srvs \
            ros-jazzy-ros-gz \
            xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Report the rendering backend
        shell: bash
        run: |
          set -ex
          xvfb-run -a glxinfo -B || echo "glxinfo unavailable"
      - name: colcon build
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Launch the stack and verify the frames before anything moves
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          mkdir -p logs
          printf 'target=%s\ntrial=%s\nworkflow_run=%s\n' \
            '${{ matrix.target }}' '${{ matrix.trial }}' "$GITHUB_RUN_ID" \
            > logs/matrix.txt

          # auto_start:=false so the vehicles stay at their spawn poses long
          # enough for the map->odom transforms to be checked against them.
          # Headless: gz server only; sensors still render, through llvmpipe.
          #
          # mission_ci.yaml is a partial overlay that only slows the scan. What
          # limits target confirmation here is frames per *metre flown*, not
          # frames per second: llvmpipe delivers ~0.7 frames per simulated
          # second, so at the shipped 1.6 m/s a station is seen 2-3 times, right
          # on the three sightings CONFIRMED needs. Capping the simulator's
          # real-time factor does not help - rendering is wall-clock bound, so
          # Gazebo simply drops more frames per simulated second (measured: 0.7
          # at RTF 0.15, 0.33 at RTF 0.05). Flying slower does help.
          CI_CONFIG="$PWD/ros2_ws/src/mission_bringup/config/mission_ci.yaml"
          test -f "$CI_CONFIG"
          nohup xvfb-run -a --server-args="-screen 0 1600x1200x24" ros2 launch mission_bringup mission.launch.py target_qr:=${{ matrix.target }} headless:=true rviz:=false auto_start:=false "config_file:=$CI_CONFIG" > logs/launch.log 2>&1 &

          for i in $(seq 1 60); do
            if ros2 topic list 2>/dev/null | grep -q /mission/status; then break; fi
            sleep 5
          done
          ros2 node list  | tee logs/nodes.txt
          ros2 topic list | tee logs/topics.txt

          # Confirm the overlay actually reached the nodes. A launch argument
          # that silently fails to apply has cost two full runs already.
          grep -h "\[CONFIG\]\|explorer ready" logs/launch.log | tee logs/config.txt
          grep -q "mission_ci.yaml" logs/config.txt
          grep -q "scan speed 0.50 m/s" logs/config.txt

          # Meaningful only while the vehicles are still parked.
          ros2 run mission_bringup check_frames.py | tee logs/frames.txt
      - name: Start the mission through the action and watch the pipeline
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash

          ros2 action send_goal \
            /mission/run_mission \
            mission_interfaces/action/RunMission \
            "{target_qr: '${{ matrix.target }}'}" \
            > logs/action.log 2>&1 &

          # Which stage of the data path is the first to go quiet?
          ros2 run mission_bringup check_pipeline.py --timeout 900 \
            --save-images logs/frames | tee logs/pipeline.txt
      - name: Wait for the mission verdict
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          # THE gate for this job: exits non-zero unless the manager reached
          # MISSION_SUCCESS, which it only does once every mandatory validator
          # check has passed - including the rover's own QR match.
          ros2 run mission_bringup await_mission.py --timeout 4500 | tee logs/mission.txt
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash || true
          source ros2_ws/install/setup.bash || true
          # Capture what each camera is looking at right now. If the rover
          # failed to verify, this says whether it was staring at a blank
          # buffer, at empty ground, or at a code it could not decode.
          ros2 run mission_bringup check_pipeline.py --timeout 30 \
            --save-images logs/frames_final > logs/pipeline_final.txt 2>&1 || true
          ros2 run mission_bringup check_frames.py > logs/frames_check.txt 2>&1 || true
          ros2 topic echo /mission/status --once > logs/final_status.txt 2>&1 || true
          tail -400 logs/launch.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gazebo-e2e-${{ matrix.target }}-trial-${{ matrix.trial }}-logs
          path: logs/
