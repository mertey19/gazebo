# ---------------------------------------------------------------------------
# Single source of truth for every tunable mission value.
#
# Loaded by mission_core.load_mission_config().  Each ROS node declares the
# subset it uses as real ROS parameters whose *defaults* come from this file,
# so a value can be changed here, on the launch command line, or at runtime
# with `ros2 param set` - and the three never disagree about what the default
# was.
#
# load_mission_config() rejects unknown keys, so a typo fails loudly at
# startup instead of silently falling back to a built-in default.
# ---------------------------------------------------------------------------

mission:
  # Which station the rover must physically reach. Overridden by the launch
  # argument `target_qr:=` or by the RunMission action goal.
  target_qr: "TARGET_2"
  # Payloads the operator may request. Used only to reject typos early; the
  # *positions* are never configured - they are discovered by the drone.
  known_payloads: ["TARGET_1", "TARGET_2", "TARGET_3"]
  # Side length of the printed plate on a station face, in metres. A physical
  # property of the target hardware (like an ArUco marker size), matched by
  # the <box> size in models/target_station/model.sdf.
  qr_plate_size_m: 0.80
  # White border baked into the plate texture, in QR modules. Together with
  # the plate size this fixes the code's physical size, which is what the
  # detector's corners actually bound. Matched by scripts/generate_qr_textures.py.
  qr_quiet_zone_modules: 4
  # Height of a station's plate centre above ground (pedestal + half the cube).
  # The slant range every resolution figure depends on is measured to this.
  station_plate_centre_height_m: 0.65
  mission_timeout_s: 600.0
  area_min_xy: [-11.0, -11.0]
  area_max_xy: [11.0, 11.0]

frames:
  map_frame: "map"
  odom_frame: "odom"
  drone_base_frame: "drone/base_link"
  drone_camera_optical_frame: "drone/camera_optical_frame"
  drone_lidar_frame: "drone/lidar_link"
  rover_base_frame: "rover/base_link"
  rover_camera_optical_frame: "rover/camera_optical_frame"
  rover_lidar_frame: "rover/lidar_link"

drone:
  # With the 30 degree camera below, 4.0 m puts a station plate at a 6.7 m
  # slant range: ~4.6 px per QR module, above the 3.0 floor. Validated at
  # startup, along with the lidar's ground coverage versus the lane spacing.
  scan_altitude_m: 4.0
  takeoff_speed_mps: 1.2
  scan_speed_mps: 1.6
  # The occupancy grid comes from the *lidar*, which looks straight down and
  # reaches a 4.0 m ground radius at this altitude, so 5.0 m lanes overlap.
  lane_spacing_m: 5.0
  scan_margin_m: 2.0
  altitude_tolerance_m: 0.25
  waypoint_tolerance_m: 0.6
  exploration_timeout_s: 300.0
  # Keep scanning after the requested target is confirmed, so the digital twin
  # ends up complete rather than containing only what was strictly needed.
  finish_scan_after_target_found: true
  control_rate_hz: 30.0
  # How far below horizontal the drone camera points (pi/2 would be straight
  # down). Looking ahead at 30 degrees sees a station's vertical faces almost
  # head-on rather than foreshortening its top plate.
  camera_depression_rad: 0.5235988
  # Escort geometry: the drone holds station behind the rover by
  # altitude / tan(depression) so the rover sits mid-frame.
  follow_distance_scale: 1.0
  follow_speed_mps: 2.2
  camera:
    width: 1280
    height: 960
    horizontal_fov_rad: 1.047
    # Matches perception.qr_detection_rate_hz below; the detector throttles to
    # that anyway, and rendering the extra frames dominates cost without a GPU.
    update_rate_hz: 6.0

rover:
  max_linear_velocity: 0.8
  max_angular_velocity: 1.4
  lookahead_distance_m: 0.9
  min_lookahead_distance_m: 0.35
  lookahead_time_s: 0.6
  heading_kp: 2.0
  # Above this heading error the rover turns on the spot instead of arcing,
  # which keeps it on the collision-checked path at the start of each leg.
  rotate_in_place_rad: 0.7
  goal_tolerance_m: 0.35
  goal_yaw_tolerance_rad: 0.30
  align_to_goal_yaw: true
  max_cross_track_error_m: 1.5
  cross_track_grace_s: 3.0
  approach_slowdown_m: 1.0
  navigation_timeout_s: 240.0
  control_rate_hz: 20.0
  # Must stay below the clearance the planner guarantees as seen from the
  # lidar (rover_radius + safety_margin - lidar offset); otherwise the
  # emergency stop fires on the rover's own correctly planned path.
  obstacle_stop_distance_m: 0.30
  safety_lidar_forward_offset_m: 0.24
  obstacle_stop_half_angle_rad: 0.35
  # If a newly appeared obstacle holds the safety stop this long, refresh the
  # route from the rover's live pose instead of waiting for navigation timeout.
  safety_stop_replan_delay_s: 3.0
  # Replan once from the live rover pose after a controller tracking failure.
  # A second failure is terminal so recovery cannot loop indefinitely.
  max_replans: 1
  camera:
    width: 640
    height: 480
    horizontal_fov_rad: 1.20
    update_rate_hz: 6.0

perception:
  qr_detection_rate_hz: 6.0
  max_reprojection_error_px: 4.0
  min_quad_area_px: 400.0
  min_apparent_size_px: 40.0
  min_pixels_per_module: 3.0
  max_consecutive_bad_frames: 30

world_model:
  association_radius_m: 1.5
  min_observations: 3
  min_confidence: 0.35
  grid_resolution_m: 0.20
  # Lidar returns above this height are obstacles; below it they are ground.
  obstacle_min_height_m: 0.25
  obstacle_max_height_m: 8.0
  mapper_min_hits: 2
  mapper_hit_ratio: 0.35
  publish_rate_hz: 2.0

planner:
  rover_radius_m: 0.30
  # Sized so pure pursuit can cut a corner by ~0.12 m and the safety lidar
  # still reads more than rover.obstacle_stop_distance_m on a clean path.
  obstacle_safety_margin_m: 0.40
  planning_resolution_m: 0.20
  # Fail closed: the rover stays inside the area the drone actually observed.
  # Set true only when an operator deliberately accepts unknown-space travel.
  allow_unknown: false
  heuristic_weight: 1.0
  shortcut: true
  approach_distance_m: 1.8
  approach_distance_tolerance_m: 0.6
  approach_samples: 72
  # Radius of a station's own footprint. Occupied cells this close to a target
  # are the station itself, so they must not count as occluding it.
  target_footprint_radius_m: 0.70
  max_start_snap_m: 1.5

verification:
  timeout_s: 30.0
  required_consecutive_reads: 3
  # A code further away than this is a different station seen in the
  # background, not the one the rover parked in front of.
  max_range_m: 4.0
  # On arrival the rover sweeps its heading looking for the code. Wheel
  # odometry drifts in yaw, so "facing the station" is an estimate; a station
  # 0.4 rad off-axis already falls outside the 1.2 rad camera.
  search_sweep_rad: 1.05
  search_yaw_rate_rad_s: 0.4
  # Retry one complete sweep when no code is decoded. A confidently decoded
  # wrong payload still fails immediately.
  max_attempts: 2
